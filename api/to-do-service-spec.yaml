openapi: 3.1.0
info:
  title: Task Management API
  version: 1.0.0
paths:
  /users:
    get:
      summary: Get all users
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              examples:
                default:
                  value:
                    users:
                      - last_name: "Smith"
                        first_name: "Ferdinand"
                        email: "f.smith@example.com"
                        id: 1
                      - last_name: "Jones"
                        first_name: "Jill"
                        email: "j.jones@example.com"
                        id: 2
                      - last_name: "Martinez"
                        first_name: "Marty"
                        email: "m.martinez@example.com"
                        id: 3
                      - last_name: "Bailey"
                        first_name: "Bill"
                        email: "b.bailey@example.com"
                        id: 4
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'

    post:
      summary: Add a user
      requestBody:
        required: true
        content:
          application/json:
            examples:
              default:
                value:
                  last_name: "Doe"
                  first_name: "John"
                  email: "j.doe@example.com"
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: User added successfully
          content:
            application/json:
              examples:
                default:
                  value:
                    id: 5
                    last_name: "Doe"
                    first_name: "John"
                    email: "j.doe@example.com"
              schema:
                $ref: '#/components/schemas/User'

  /users/{userId}:
    get:
      summary: Get a user by ID
      parameters:
        - name: userId
          in: path
          required: true
          description: ID of the user
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              examples:
                default:
                  value:
                    last_name: "Smith"
                    first_name: "Ferdinand"
                    email: "f.smith@example.com"
                    id: 1
              schema:
                $ref: '#/components/schemas/User'

    patch:
      summary: Update a property of a user (excluding ID)
      parameters:
        - name: userId
          in: path
          required: true
          description: ID of the user
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            examples:
              default:
                value:
                  email: "new.email@example.com"
            schema:
              $ref: '#/components/schemas/UserPatch'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              examples:
                default:
                  value:
                    last_name: "Smith"
                    first_name: "Ferdinand"
                    email: "new.email@example.com"
                    id: 1
              schema:
                $ref: '#/components/schemas/User'

    delete:
      summary: Delete a user by ID
      parameters:
        - name: userId
          in: path
          required: true
          description: ID of the user
          schema:
            type: integer
      responses:
        '204':
          description: User deleted successfully

  /tasks:
    get:
      summary: Get all tasks
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              examples:
                default:
                  value:
                    tasks:
                      - user_id: 1
                        title: "Grocery shopping"
                        description: "eggs, bacon, gummy bears"
                        due_date: "2024-02-20T17:00"
                        warning: "-10"
                        id: 1
                      - user_id: 1
                        title: "Piano recital"
                        description: "Daughter's first concert appearance"
                        due_date: "2024-04-02T15:00"
                        warning: "-30"
                        id: 2
                      - user_id: 2
                        title: "Oil change"
                        description: "5K auto service"
                        due_date: "2024-03-10T09:00"
                        warning: "-60"
                        id: 3
                      - user_id: 3
                        title: "Get shots for dog"
                        description: "Annual vaccinations for poochy"
                        due_date: "2024-05-11T14:00"
                        warning: "-20"
                        id: 4
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'

    post:
      summary: Add a task
      requestBody:
        required: true
        content:
          application/json:
            examples:
              default:
                value:
                  user_id: 1
                  title: "New Task"
                  description: "Description of the new task"
                  due_date: "2024-06-01T12:00"
                  warning: "-5"
            schema:
              $ref: '#/components/schemas/TaskInput'
      responses:
        '201':
          description: Task added successfully
          content:
            application/json:
              examples:
                default:
                  value:
                    id: 5
                    user_id: 1
                    title: "New Task"
                    description: "Description of the new task"
                    due_date: "2024-06-01T12:00"
                    warning: "-5"
              schema:
                $ref: '#/components/schemas/Task'

  /tasks/{taskId}:
    get:
      summary: Get a task by ID
      parameters:
        - name: taskId
          in: path
          required: true
          description: ID of the task
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              examples:
                default:
                  value:
                    user_id: 1
                    title: "Grocery shopping"
                    description: "eggs, bacon, gummy bears"
                    due_date: "2024-02-20T17:00"
                    warning: "-10"
                    id: 1
              schema:
                $ref: '#/components/schemas/Task'

    patch:
      summary: Update a property of a task (excluding ID)
      parameters:
        - name: taskId
          in: path
          required: true
          description: ID of the task
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            examples:
              default:
                value:
                  description: "Updated description"
            schema:
              $ref: '#/components/schemas/TaskPatch'
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              examples:
                default:
                  value:
                    user_id: 1
                    title: "Grocery shopping"
                    description: "Updated description"
                    due_date: "2024-02-20T17:00"
                    warning: "-10"
                    id: 1
              schema:
                $ref: '#/components/schemas/Task'

    delete:
      summary: Delete a task by ID
      parameters:
        - name: taskId
          in: path
          required: true
          description: ID of the task
          schema:
            type: integer
      responses:
        '204':
          description: Task deleted successfully

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        last_name:
          type: string
        first_name:
          type: string
        email:
          type: string
          format: email
      required:
        - id
        - last_name
        - first_name
        - email
    
    UserInput:
      type: object
      properties:
        last_name:
          type: string
        first_name:
          type: string
        email:
          type: string
          format: email
      required:
        - last_name
        - first_name
        - email
    
    UserPatch:
      type: object
      properties:
        last_name:
          type: string
        first_name:
          type: string
        email:
          type: string
          format: email
      minProperties: 1
    
    Task:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        title:
          type: string
        description:
          type: string
        due_date:
          type: string
          format: date-time
        warning:
          type: string
      required:
        - id
        - user_id
        - title
        - due_date
        - warning
    
    TaskInput:
      type: object
      properties:
        user_id:
          type: integer
        title:
          type: string
        description:
          type: string
        due_date:
          type: string
          format: date-time
        warning:
          type: string
      required:
        - user_id
        - title
        - due_date
        - warning
    
    TaskPatch:
      type: object
      properties:
        user_id:
          type: integer
        title:
          type: string
        description:
          type: string
        due_date:
          type: string
          format: date-time
        warning:
          type: string
      minProperties: 1